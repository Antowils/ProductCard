<!DOCTYPE html>
<html>
<head>
    <title>Product Card Hover Effect</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
            background:#f4f4f4;
        }

        .container{
            margin-top:50px;
        }

        .card{
            width:300px;
            background:white;
            border-radius:15px;
            overflow:hidden;
            text-align:center;
            box-shadow:0 4px 8px rgba(0,0,0,0.2);
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-10px);
            box-shadow:0 10px 20px rgba(0,0,0,0.4);
        }

        .image-box{
            overflow:hidden;
        }

        .image-box img{
            width:100%;
            height:220px;
            transition:0.4s;
        }

        .card:hover img{
            transform:scale(1.1);
        }

        .content{
            padding:20px;
        }

        .content h2{
            margin-bottom:10px;
        }

        .content p{
            margin-bottom:10px;
        }

        .price{
            font-size:22px;
            color:green;
            font-weight:bold;
            margin-bottom:15px;
        }

        button{
            padding:10px 20px;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
            cursor:pointer;
            transition:0.4s;
        }

        .card:hover button{
            background:#28a745;
        }

        footer{
            width:100%;
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <div class="image-box">
                <img src="nikeeeee.jpg" width="100px" height="100px">
            </div>

            <div class="content">
                <h2>Running Shoes</h2>

                <p>
                    Comfortable and stylish running shoes for daily use.
                </p>

                <div class="price">₹19,999</div>

                <button>Add to Cart</button>
            </div>

        </div>
    </div>

    <footer>
        <h3>Developed By: Anto Williams S</h3>
        <p>Register Number: 212224240012</p>
    </footer>

</body>
</html>
